name: Playwright Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'evidence/**'
      - 'SHA256SUMS.txt'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'evidence/**'
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Instalar Chromium e dependências Linux
        run: npx playwright install --with-deps chromium
      - name: Executar os cinco testes
        run: npm test
      - name: Disponibilizar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
